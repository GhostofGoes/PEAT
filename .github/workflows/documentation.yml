# Build, check, and publish the documentation
# based in part on https://github.com/sandialabs/firewheel/blob/main/.github/workflows/documentation.yml
#
# - Pull requests: build with warnings as errors and run the accessibility checks
#   (both must pass), plus a non-blocking link check.
# - Pushes to main (and dispatches from release.yml): build and deploy to GitHub Pages.
#
# The documentation has its own lock file (pdm.docs.lock) and virtualenv so that a current
# Sphinx can be used alongside PEAT's pinned runtime dependencies; see
# docs/contributing/documentation.rst.
name: Documentation

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - docs/**
      - peat/**
      - examples/**
      - CONTRIBUTING.rst
      - CHANGELOG.rst
      - CODE_OF_CONDUCT.rst
      - AUTHORS
      - pdm.docs.lock
      - pyproject.toml
      - scripts/docs_a11y.py
      - .github/workflows/documentation.yml
  # Also dispatched by release.yml right after it creates the release tag, so
  # GitHub Pages picks up the new version. That has to be an explicit dispatch:
  # the tag is pushed with GITHUB_TOKEN, and events caused by GITHUB_TOKEN never
  # trigger other workflows. A "release: published" trigger would not work
  # either, because the github-pages environment only allows deployments from
  # the main branch, not from tags.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  docs:
    name: Build documentation (HTML)
    runs-on: ubuntu-24.04
    steps:
      # This will block outbound connections that aren't explicitly allowed
      # If this causes a pipeline to fail, investigate what endpoints were blocked.
      # If they are legitimate, then change to audit mode, run pipeline and collect
      # endpoints from StepSecurity report, update list of endpoints, then change back
      # to "block".
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            files.pythonhosted.org:443
            github.com:443
            pdm-project.org:443
            pdm.fming.dev:443
            pypi.org:443
            raw.githubusercontent.com:443
            azure.archive.ubuntu.com:80
            esm.ubuntu.com:443
            motd.ubuntu.com:443
            packages.microsoft.com:443
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
            fetch-tags: true
            fetch-depth: 0  # checkout full history
      # NOTE: awalsh128/cache-apt-pkgs-action was failing with cache failures
      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends graphviz
          dot -V
      - name: Setup PDM
        uses: pdm-project/setup-pdm@94a823180e06fcde4ad29308721954a521c96ed0 # v4
        with:
          python-version: "3.12"
          cache: true
          cache-dependency-path: pdm.docs.lock
      # The docs build needs the "docs" virtualenv from pdm.docs.lock (see pyproject.toml)
      - name: Install dependencies
        run: pdm run docs-venv
      # NOTE: this also regenerates docs/developer/dependencies_table.rst ("pdm run dep-doc").
      # Warnings are errors (-W --keep-going).
      - name: Build docs
        run: pdm run docs-html
      - name: Build man page
        run: pdm run docs-man
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _docs_html/
      - name: Upload man page
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-manpage
          path: _docs_man/peat.1
          if-no-files-found: error

  accessibility:
    name: Accessibility checks (axe-core)
    runs-on: ubuntu-24.04
    needs: docs
    steps:
      # Playwright downloads Chromium from Microsoft's CDN, so the egress policy is "audit"
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Download built docs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: github-pages
          path: pages-artifact
      - name: Extract built docs
        run: |
          mkdir -p _docs_html
          tar -xf pages-artifact/artifact.tar -C _docs_html
          ls _docs_html | head
      - name: Setup PDM
        uses: pdm-project/setup-pdm@94a823180e06fcde4ad29308721954a521c96ed0 # v4
        with:
          python-version: "3.12"
          cache: true
          cache-dependency-path: pdm.docs.lock
      - name: Install dependencies
        run: |
          pdm run docs-venv
          pdm run --venv docs playwright install --with-deps chromium
      - name: Run accessibility checks
        run: pdm run --venv docs python scripts/docs_a11y.py _docs_html --json a11y-report.json
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: accessibility-report
          path: a11y-report.json
          if-no-files-found: ignore

  linkcheck:
    name: Check external links (non-blocking)
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      # The link checker contacts arbitrary external sites, so the egress policy is "audit"
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends graphviz
      - name: Setup PDM
        uses: pdm-project/setup-pdm@94a823180e06fcde4ad29308721954a521c96ed0 # v4
        with:
          python-version: "3.12"
          cache: true
          cache-dependency-path: pdm.docs.lock
      - name: Install dependencies
        run: pdm run docs-venv
      # Non-blocking: broken external links show up as a warning on this step (and in the
      # uploaded results), not as a failed check on the pull request
      - name: Check links
        continue-on-error: true
        run: pdm run docs-linkcheck
      - name: Upload link check results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linkcheck-results
          path: _docs_linkcheck/output.*
          if-no-files-found: ignore

  deploy:
    name: Publish docs to GitHub Pages
    runs-on: ubuntu-latest
    needs: [docs, accessibility]
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
