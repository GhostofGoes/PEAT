# Security linting of the GitHub Actions workflows with zizmor
# https://docs.zizmor.sh/
name: GitHub Actions Security Analysis

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read  # checkout
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            pypi.org:443
            files.pythonhosted.org:443
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # Findings are reported as annotations and fail the job, instead of being
      # uploaded to code scanning, so they show up on pull requests from forks.
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          # Keep in sync with the zizmor-pre-commit "rev" in .pre-commit-config.yaml
          version: 1.31.1
          advanced-security: false
          annotations: true
          config: .github/zizmor.yml
