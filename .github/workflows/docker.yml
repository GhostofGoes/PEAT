# Docker has it's own release pipeline separate from workflow
# When the release workflow finishes and a release is published,
# that will trigger docker build.
#   full release: tag latest + version
#   pre-release: tag version, with "pre-"
name: Docker Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'  # tags such as v1.2.3
      - 'v*.*.*-prerelease'  # tags such as v1.2.3
  # Build and check, but don't push, the image when a PR changes it, and
  # weekly without the build cache, so broken dependencies (e.g. an apt package
  # removed from the Zeek repository) are caught before a release needs them.
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/docker.yml
  schedule:
    - cron: '17 6 * * 1'  # Mondays at 06:17 UTC
  workflow_dispatch:

jobs:
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0  # checkout full history
      - name: Set Tag and Build Timestamp
        id: tag_ts
        run: |
          # Get the most recent tag (by semantic version order)
          TAG=$(git describe --tags --abbrev=0)
          BUILD_TS="$(date -I'seconds')"
          echo "Latest tag is $TAG"
          echo "Build timestamp is $BUILD_TS"
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
          echo "BUILD_TS=$BUILD_TS" >> "$GITHUB_OUTPUT"
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          # list of Docker images to use as base name for tags
          images: |
            ghcr.io/${{ github.repository }}
          labels: |
            built_by=github-actions
            org.opencontainers.image.source=${{ github.server_url}}/${{ github.repository }}
            org.opencontainers.image.created=${{ steps.tag_ts.outputs.BUILD_TS }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tag_ts.outputs.TAG }}
          # generate Docker tags based on the following events/attributes
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=,suffix=,format=short

      - name: Log in to GitHub Docker Registry
        if: github.event_name != 'pull_request' && github.event_name != 'schedule'
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0  # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build the Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          build-args: |
            PDM_BUILD_SCM_VERSION=${{ steps.tag_ts.outputs.TAG }}
          push: ${{ github.event_name != 'pull_request' && github.event_name != 'schedule' }}
          load: ${{ github.event_name == 'pull_request' || github.event_name == 'schedule' }}
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # TODO: dedicated builder image for caching like we did in GitLab?
          # gha cache has 10GB size limit.
          # target: builder
          # https://docs.docker.com/build/cache/backends/gha/
          cache-from: type=gha,mode=max,scope={{ github.ref }}
          cache-to: type=gha,mode=max,scope={{ github.ref }}

      - name: Check PEAT and Zeek in the image
        if: github.event_name == 'pull_request' || github.event_name == 'schedule'
        env:
          IMAGE: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: |
          docker run --rm "$IMAGE" --version
          docker run --rm --entrypoint zeek "$IMAGE" --version
          # Parse-only check that the HEAT FTPExtractor script works with this Zeek version
          docker run --rm --entrypoint zeek "$IMAGE" -a /PEAT/peat/heat/ftp_extractor_zeek_script.zeek
