<figure class="peat-diagram" id="peat-run-lifecycle">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 392" role="img" aria-labelledby="rl-title rl-desc">
  <title id="rl-title">Lifecycle of a PEAT run</title>
  <desc id="rl-desc">Five numbered stages from left to right. 1, Argument parsing: peat.cli_args.build_argument_parser builds one sub-parser per command with the general and command options; --help and --version print and exit here; the parsed arguments are passed to cli_main.run_peat. 2, Initialization: peat.init.initialize_peat loads the settings from the configuration file, the environment, and the command line, creates the run directory, starts logging, and connects to Elasticsearch if -e was given; a configuration error ends the run with exit code 1 here, before any packet is sent. 3, Informational commands: --list-modules, --examples, and the other listing arguments print their output and exit with code 0; config-builder, --pdb, and --repl also stop here, after initialization, with PEAT configured. 4, Running the command: cli_main.oneshot_main resolves the targets from -i, -b, -s, or -f (--dry-run stops here), then calls the command's API function in peat.api: scan, pull, parse, push, pillage, or heat; the device modules write into the datastore, -E prints the summary, and an error marks the run as failed. 5, Finishing: configuration and state are pushed to Elasticsearch, empty directories are removed, README.md is written, and at exit the device sessions are closed and peat_configuration.yaml and peat_state.yaml are saved; the exit code is 1 if any error was recorded, else 0. A timeline below the stages shows what is on disk: the run directory is created in stage 2 and the configuration is copied into peat_metadata/; logs/ (peat.log, json-log.jsonl, debug-info.txt, protocol logs) is written from stage 2 to the end; devices/ and summaries/ (device-data-* files and the summary JSON) are written during stages 4 and 5; peat_metadata/peat_configuration.yaml, peat_state.yaml, and README.md are written at exit.</desc>
  <defs>
    <marker id="rl-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--color-foreground-secondary)"/>
    </marker>
  </defs>
  <style>
    .rl-text { font-size: 13px; fill: var(--color-foreground-primary); }
    .rl-small { font-size: 12px; fill: var(--color-foreground-secondary); }
    .rl-code { font-size: 12px; font-family: var(--font-stack--monospace); fill: var(--color-foreground-primary); }
    .rl-dir { font-size: 12px; font-weight: 600; fill: var(--color-foreground-primary); }
    .rl-head { font-size: 13px; font-weight: 600; fill: var(--color-foreground-primary); }
    .rl-label { font-size: 12px; font-weight: 600; letter-spacing: 0.04em; fill: var(--color-foreground-secondary); }
    .rl-num { font-size: 13px; font-weight: 600; fill: var(--color-background-primary); }
    .rl-halo { paint-order: stroke fill; stroke: var(--color-background-primary); stroke-width: 5px; stroke-linejoin: round; }
    .rl-box { fill: var(--color-background-secondary); stroke: var(--color-foreground-border); stroke-width: 1.2; }
    .rl-rule { stroke: var(--color-foreground-border); stroke-width: 1; opacity: 0.6; }
    .rl-step { fill: var(--color-brand-primary); stroke: none; }
    .rl-api { fill: var(--color-brand-primary); stroke: none; }
    .rl-api-text { font-size: 12px; font-weight: 600; fill: var(--color-background-primary); }
    .rl-api-small { font-size: 12px; fill: var(--color-background-primary); }
    .rl-exit { fill: var(--color-background-primary); stroke: var(--color-foreground-secondary); stroke-width: 1.2; stroke-dasharray: 4 3; }
    .rl-arrow { fill: none; stroke: var(--color-foreground-secondary); stroke-width: 1.6; marker-end: url(#rl-arrow); }
    .rl-line { fill: none; stroke: var(--color-foreground-secondary); stroke-width: 1.2; }
    .rl-guide { fill: none; stroke: var(--color-foreground-border); stroke-width: 1; stroke-dasharray: 3 4; opacity: 0.7; }
    .rl-bar { fill: var(--color-background-secondary); stroke: var(--color-brand-primary); stroke-width: 1.2; }
    .rl-mark { fill: var(--color-brand-primary); stroke: none; }
  </style>

  <!-- Stepper: numbered circles joined by arrows, one above each stage -->
  <path d="M 122 24 L 288 24" class="rl-arrow"/>
  <path d="M 318 24 L 484 24" class="rl-arrow"/>
  <path d="M 514 24 L 680 24" class="rl-arrow"/>
  <path d="M 710 24 L 876 24" class="rl-arrow"/>
  <path d="M 108 36 L 108 48 M 304 36 L 304 48 M 500 36 L 500 48 M 696 36 L 696 48 M 892 36 L 892 48" class="rl-line"/>
  <circle cx="108" cy="24" r="12" class="rl-step"/><text x="108" y="28.5" text-anchor="middle" class="rl-num">1</text>
  <circle cx="304" cy="24" r="12" class="rl-step"/><text x="304" y="28.5" text-anchor="middle" class="rl-num">2</text>
  <circle cx="500" cy="24" r="12" class="rl-step"/><text x="500" y="28.5" text-anchor="middle" class="rl-num">3</text>
  <circle cx="696" cy="24" r="12" class="rl-step"/><text x="696" y="28.5" text-anchor="middle" class="rl-num">4</text>
  <circle cx="892" cy="24" r="12" class="rl-step"/><text x="892" y="28.5" text-anchor="middle" class="rl-num">5</text>

  <!-- Stage 1: argument parsing -->
  <rect x="15" y="48" width="186" height="192" rx="8" class="rl-box"/>
  <text x="108" y="70" text-anchor="middle" class="rl-head">Argument parsing</text>
  <line x1="27" y1="80" x2="189" y2="80" class="rl-rule"/>
  <text x="108" y="97" text-anchor="middle" class="rl-code">peat.cli_args.</text>
  <text x="108" y="112" text-anchor="middle" class="rl-code">build_argument_parser</text>
  <text x="108" y="132" text-anchor="middle" class="rl-small">a sub-parser per command</text>
  <text x="108" y="147" text-anchor="middle" class="rl-small">general + command options</text>
  <text x="108" y="167" text-anchor="middle" class="rl-small">parsed arguments →</text>
  <text x="108" y="182" text-anchor="middle" class="rl-code">cli_main.run_peat</text>
  <rect x="25" y="203" width="166" height="32" rx="6" class="rl-exit"/>
  <text x="108" y="216" text-anchor="middle" class="rl-small">--help, --version:</text>
  <text x="108" y="229" text-anchor="middle" class="rl-small">print and exit here</text>

  <!-- Stage 2: initialization -->
  <rect x="211" y="48" width="186" height="192" rx="8" class="rl-box"/>
  <text x="304" y="70" text-anchor="middle" class="rl-head">Initialization</text>
  <line x1="223" y1="80" x2="385" y2="80" class="rl-rule"/>
  <text x="304" y="97" text-anchor="middle" class="rl-code">peat.init.</text>
  <text x="304" y="112" text-anchor="middle" class="rl-code">initialize_peat</text>
  <text x="304" y="132" text-anchor="middle" class="rl-small">load settings from the</text>
  <text x="304" y="147" text-anchor="middle" class="rl-small">config file, env, CLI</text>
  <text x="304" y="162" text-anchor="middle" class="rl-small">create the run directory</text>
  <text x="304" y="177" text-anchor="middle" class="rl-small">start logging</text>
  <text x="304" y="192" text-anchor="middle" class="rl-small">connect to Elastic (-e)</text>
  <rect x="221" y="203" width="166" height="32" rx="6" class="rl-exit"/>
  <text x="304" y="216" text-anchor="middle" class="rl-small">config error: exit 1,</text>
  <text x="304" y="229" text-anchor="middle" class="rl-small">no packet sent yet</text>

  <!-- Stage 3: informational commands -->
  <rect x="407" y="48" width="186" height="192" rx="8" class="rl-box"/>
  <text x="500" y="70" text-anchor="middle" class="rl-head">Informational commands</text>
  <line x1="419" y1="80" x2="581" y2="80" class="rl-rule"/>
  <text x="500" y="97" text-anchor="middle" class="rl-code">cli_main.run_peat</text>
  <text x="500" y="117" text-anchor="middle" class="rl-small">--list-modules,</text>
  <text x="500" y="132" text-anchor="middle" class="rl-small">--examples, ...</text>
  <text x="500" y="147" text-anchor="middle" class="rl-small">config-builder</text>
  <text x="500" y="162" text-anchor="middle" class="rl-small">--pdb, --repl: debug here</text>
  <text x="500" y="182" text-anchor="middle" class="rl-small">run after initialization,</text>
  <text x="500" y="197" text-anchor="middle" class="rl-small">with PEAT configured</text>
  <rect x="417" y="203" width="166" height="32" rx="6" class="rl-exit"/>
  <text x="500" y="216" text-anchor="middle" class="rl-small">print (JSON or text)</text>
  <text x="500" y="229" text-anchor="middle" class="rl-small">and exit 0</text>

  <!-- Stage 4: running the command -->
  <rect x="603" y="48" width="186" height="192" rx="8" class="rl-box"/>
  <text x="696" y="70" text-anchor="middle" class="rl-head">Running the command</text>
  <line x1="615" y1="80" x2="777" y2="80" class="rl-rule"/>
  <text x="696" y="97" text-anchor="middle" class="rl-code">cli_main.oneshot_main</text>
  <text x="696" y="115" text-anchor="middle" class="rl-small">targets from -i/-b/-s/-f</text>
  <text x="696" y="130" text-anchor="middle" class="rl-small">--dry-run stops here (0)</text>
  <rect x="615" y="139" width="162" height="48" rx="6" class="rl-api"/>
  <text x="696" y="155" text-anchor="middle" class="rl-api-text">peat.api</text>
  <text x="696" y="169" text-anchor="middle" class="rl-api-small">scan · pull · parse</text>
  <text x="696" y="183" text-anchor="middle" class="rl-api-small">push · pillage · heat</text>
  <text x="696" y="203" text-anchor="middle" class="rl-small">modules → datastore</text>
  <text x="696" y="218" text-anchor="middle" class="rl-small">-E prints the summary</text>
  <text x="696" y="233" text-anchor="middle" class="rl-small">errors mark the run failed</text>

  <!-- Stage 5: finishing -->
  <rect x="799" y="48" width="186" height="192" rx="8" class="rl-box"/>
  <text x="892" y="70" text-anchor="middle" class="rl-head">Finishing</text>
  <line x1="811" y1="80" x2="973" y2="80" class="rl-rule"/>
  <text x="892" y="97" text-anchor="middle" class="rl-code">cli_main.run_peat</text>
  <text x="892" y="117" text-anchor="middle" class="rl-small">config + state → Elastic</text>
  <text x="892" y="132" text-anchor="middle" class="rl-small">remove empty directories</text>
  <text x="892" y="147" text-anchor="middle" class="rl-small">write README.md</text>
  <text x="892" y="162" text-anchor="middle" class="rl-small">at exit: close sessions,</text>
  <text x="892" y="177" text-anchor="middle" class="rl-small">save configuration and state</text>
  <text x="892" y="192" text-anchor="middle" class="rl-code">peat_state.yaml</text>
  <rect x="809" y="203" width="166" height="32" rx="6" class="rl-exit"/>
  <text x="892" y="216" text-anchor="middle" class="rl-small">exit code 1 if any error</text>
  <text x="892" y="229" text-anchor="middle" class="rl-small">was recorded, else 0</text>

  <!-- On-disk timeline -->
  <path d="M 206 250 L 206 382 M 402 250 L 402 382 M 598 250 L 598 382 M 794 250 L 794 382" class="rl-guide"/>
  <text x="15" y="268" class="rl-label">ON DISK</text>
  <text x="86" y="268" class="rl-small rl-halo">what the run directory holds as the run progresses</text>
  <path d="M 15 292 L 985 292" class="rl-line"/>

  <polygon points="211,285 218,292 211,299 204,292" class="rl-mark"/>
  <text x="226" y="287" class="rl-small rl-halo">run directory created: <tspan class="rl-dir">peat_results/&lt;run&gt;/</tspan>, configuration copied into <tspan class="rl-dir">peat_metadata/</tspan></text>

  <rect x="211" y="302" width="754" height="20" rx="4" class="rl-bar"/>
  <text x="221" y="316" class="rl-small"><tspan class="rl-dir">logs/</tspan>  peat.log, json-log.jsonl, debug-info.txt, protocol logs, written throughout the run</text>

  <rect x="603" y="330" width="362" height="20" rx="4" class="rl-bar"/>
  <text x="613" y="344" class="rl-small"><tspan class="rl-dir">devices/, summaries/</tspan>  device-data-*, *-summary.json</text>

  <polygon points="975,285 982,292 975,299 968,292" class="rl-mark"/>
  <path d="M 975 299 L 975 364" class="rl-guide"/>
  <text x="981" y="376" text-anchor="end" class="rl-small rl-halo">at exit: <tspan class="rl-dir">peat_metadata/</tspan>peat_configuration.yaml, peat_state.yaml, README.md</text>
</svg>
<figcaption class="peat-dg-caption">The five stages of a PEAT run, with the functions involved and what appears in the run directory along the way. Dashed boxes mark where a run can end early.</figcaption>
</figure>
