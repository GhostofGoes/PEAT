<figure class="peat-diagram" id="peat-encryption-flow">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 396" role="img" aria-labelledby="ef-title ef-desc">
  <title id="ef-title">Encrypting configuration files and results</title>
  <desc id="ef-desc">Two rows. Top row, Configuration: site.yaml, which holds device credentials, is encrypted with peat encrypt-config -f site.yaml into encrypted_site.yaml (a Fernet-encrypted file with a PEAT_CRYPT header). The encrypted file is used directly: peat pull -d selrelay -c encrypted_site.yaml -i 192.0.2.0/24 starts the run, and the credentials are decrypted in memory at start-up. Both commands take the password from the interactive "Enter a password:" prompt or from -p. The reverse is peat decrypt-config -f encrypted_site.yaml, which writes decrypted_config.yaml and leaves the original untouched. The passphrase is handed to the operator separately and is not a device password. Bottom row, Results: the run directory peat_results/site-a/ is packed by peat encrypt-results -f peat_results/site-a into encrypted_site-a.zip, an AES-encrypted zip archive, which travels on removable media or by email; on the analyst's machine, peat decrypt-results -f encrypted_site-a.zip restores the run directory as ./site-a/. Both commands take the password from the prompt or -p. The archive is a standard AES zip that 7-Zip and WinZip can also open; entry names inside it are not encrypted. The results passphrase travels separately from the media.</desc>
  <defs>
    <marker id="ef-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--color-foreground-secondary)"/>
    </marker>
  </defs>
  <style>
    .ef-text { font-size: 13px; fill: var(--color-foreground-primary); }
    .ef-small { font-size: 12px; fill: var(--color-foreground-secondary); }
    .ef-code { font-size: 12px; font-family: var(--font-stack--monospace); fill: var(--color-foreground-primary); }
    .ef-label { font-size: 12px; font-weight: 600; letter-spacing: 0.04em; fill: var(--color-foreground-secondary); }
    .ef-layer { fill: var(--color-background-secondary); stroke: var(--color-background-border); stroke-width: 1; }
    .ef-box { fill: var(--color-background-primary); stroke: var(--color-foreground-border); stroke-width: 1.1; }
    .ef-cmd { fill: var(--color-brand-primary); stroke: none; }
    .ef-cmd-text { font-size: 12px; font-weight: 600; font-family: var(--font-stack--monospace); fill: var(--color-background-primary); }
    .ef-cmd-arg { font-size: 11.5px; font-family: var(--font-stack--monospace); fill: var(--color-background-primary); }
    .ef-state { fill: var(--color-background-primary); stroke: var(--color-foreground-secondary); stroke-width: 1.1; stroke-dasharray: 4 3; }
    .ef-arrow { fill: none; stroke: var(--color-foreground-secondary); stroke-width: 1.6; marker-end: url(#ef-arrow); }
    .ef-dashed { stroke-dasharray: 5 4; }
  </style>

  <!-- Row 1: configuration -->
  <rect x="20" y="20" width="960" height="170" rx="10" class="ef-layer"/>
  <text x="34" y="40" class="ef-label">CONFIGURATION</text>
  <text x="160" y="40" class="ef-small">credentials travel encrypted and are decrypted only in memory, at start-up</text>

  <rect x="45" y="52" width="150" height="60" rx="6" class="ef-box"/>
  <text x="120" y="78" text-anchor="middle" class="ef-code">site.yaml</text>
  <text x="120" y="97" text-anchor="middle" class="ef-small">device credentials</text>
  <path d="M 195 82 L 217 82" class="ef-arrow"/>

  <rect x="219" y="52" width="166" height="60" rx="8" class="ef-cmd"/>
  <text x="302" y="78" text-anchor="middle" class="ef-cmd-text">peat encrypt-config</text>
  <text x="302" y="97" text-anchor="middle" class="ef-cmd-arg">-f site.yaml</text>
  <path d="M 385 82 L 407 82" class="ef-arrow"/>

  <rect x="409" y="52" width="160" height="60" rx="6" class="ef-box"/>
  <text x="489" y="78" text-anchor="middle" class="ef-code">encrypted_site.yaml</text>
  <text x="489" y="97" text-anchor="middle" class="ef-small">PEAT_CRYPT + Fernet</text>
  <path d="M 569 82 L 591 82" class="ef-arrow"/>

  <rect x="593" y="52" width="186" height="60" rx="8" class="ef-cmd"/>
  <text x="686" y="71" text-anchor="middle" class="ef-cmd-text">peat pull -d selrelay</text>
  <text x="686" y="87" text-anchor="middle" class="ef-cmd-arg">-c encrypted_site.yaml</text>
  <text x="686" y="103" text-anchor="middle" class="ef-cmd-arg">-i 192.0.2.0/24</text>
  <path d="M 779 82 L 801 82" class="ef-arrow"/>

  <rect x="803" y="52" width="150" height="60" rx="6" class="ef-state"/>
  <text x="878" y="72" text-anchor="middle" class="ef-text">The run starts</text>
  <text x="878" y="88" text-anchor="middle" class="ef-small">credentials decrypted</text>
  <text x="878" y="103" text-anchor="middle" class="ef-small">in memory only</text>

  <!-- Password for the configuration commands -->
  <path d="M 408 136 L 307 116" class="ef-arrow ef-dashed"/>
  <path d="M 580 136 L 681 116" class="ef-arrow ef-dashed"/>
  <rect x="394" y="134" width="200" height="36" rx="18" class="ef-state"/>
  <text x="494" y="150" text-anchor="middle" class="ef-code">Enter a password:</text>
  <text x="494" y="164" text-anchor="middle" class="ef-small">interactive prompt, or -p</text>

  <text x="45" y="152" class="ef-small">Reverse: peat decrypt-config -f encrypted_site.yaml</text>
  <text x="45" y="167" class="ef-small">→ decrypted_config.yaml; original left untouched</text>
  <text x="609" y="152" class="ef-small">Passphrase handed to the operator separately;</text>
  <text x="609" y="167" class="ef-small">it is not a device password.</text>

  <!-- Row 2: results -->
  <rect x="20" y="206" width="960" height="170" rx="10" class="ef-layer"/>
  <text x="34" y="226" class="ef-label">RESULTS</text>
  <text x="110" y="226" class="ef-small">collected on one system, analyzed on another</text>

  <rect x="37" y="242" width="160" height="60" rx="6" class="ef-box"/>
  <text x="117" y="266" text-anchor="middle" class="ef-text">Run directory</text>
  <text x="117" y="286" text-anchor="middle" class="ef-code">peat_results/site-a/</text>
  <path d="M 197 272 L 213 272" class="ef-arrow"/>

  <rect x="215" y="242" width="170" height="60" rx="8" class="ef-cmd"/>
  <text x="300" y="266" text-anchor="middle" class="ef-cmd-text">peat encrypt-results</text>
  <text x="300" y="286" text-anchor="middle" class="ef-cmd-arg">-f peat_results/site-a</text>
  <path d="M 385 272 L 401 272" class="ef-arrow"/>

  <rect x="403" y="242" width="164" height="60" rx="6" class="ef-box"/>
  <text x="485" y="266" text-anchor="middle" class="ef-code">encrypted_site-a.zip</text>
  <text x="485" y="286" text-anchor="middle" class="ef-small">AES-encrypted zip</text>

  <!-- Transfer: the archive leaves the system -->
  <path d="M 567 272 Q 587 222 605 272" class="ef-arrow ef-dashed"/>
  <text x="587" y="236" text-anchor="middle" class="ef-small">removable media or email</text>

  <rect x="607" y="242" width="178" height="60" rx="8" class="ef-cmd"/>
  <text x="696" y="266" text-anchor="middle" class="ef-cmd-text">peat decrypt-results</text>
  <text x="696" y="286" text-anchor="middle" class="ef-cmd-arg">-f encrypted_site-a.zip</text>
  <path d="M 785 272 L 801 272" class="ef-arrow"/>

  <rect x="803" y="242" width="160" height="60" rx="6" class="ef-box"/>
  <text x="883" y="266" text-anchor="middle" class="ef-text">Restored directory</text>
  <text x="883" y="286" text-anchor="middle" class="ef-code">./site-a/</text>

  <!-- Password for the results commands -->
  <path d="M 412 324 L 305 306" class="ef-arrow ef-dashed"/>
  <path d="M 584 324 L 691 306" class="ef-arrow ef-dashed"/>
  <rect x="398" y="322" width="200" height="36" rx="18" class="ef-state"/>
  <text x="498" y="338" text-anchor="middle" class="ef-code">Enter a password:</text>
  <text x="498" y="352" text-anchor="middle" class="ef-small">interactive prompt, or -p</text>

  <text x="37" y="340" class="ef-small">Standard AES zip: 7-Zip and WinZip can open it too.</text>
  <text x="37" y="355" class="ef-small">Entry names inside the archive are not encrypted.</text>
  <text x="617" y="340" class="ef-small">The results passphrase travels separately from</text>
  <text x="617" y="355" class="ef-small">the media. Verify checksums on both sides.</text>
</svg>
<figcaption class="peat-dg-caption">Configuration files are encrypted before they travel in and are used directly, without ever being written back in plain text. Results are encrypted before they travel out and restored on the analyst's machine.</figcaption>
</figure>
